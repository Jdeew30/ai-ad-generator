  enabled: true
  # YouTubeurs FR de tous les domaines. Une chaîne introuvable est signalée dans le journal du passage.
  channels: [
    # humour, divertissement, vlogs
    "@Squeezie", "@Amixem", "@Inoxtag", "@Michou", "@mcflyetcarlito", "@cyprien", "@NormanFaitDesVideos",
    "@mistervofficial", "@Joyca", "@SebLaFrite", "@Lebouseuh", "@Natooyt", "@LeRireJaune", "@HugoToutSeul",
    "@PierreCroce", "@LeGrandJD", "@Valouzz", "@goldenmoustache", "@StudioBagel", "@Ludovik", "@AndyRaconte",
    "@LenaSituations", "@EnjoyPhoenix", "@leaeluig", "@poissonfecond42", "@Djilsi", "@MaximeBiaggi", "@JHONRACHID69",
    "@woopgang", "@Lolywood", "@SylvainLyve", "@ZackNani", "@Rebeudeter", "@leroidesrats",
    # jeux vidéo et streamers
    "@JoueurDuGrenier", "@Gotaga", "@Mastu", "@pa.domingo", "@ZeratoR", "@SardocheLol", "@Doigby", "@TheKAIRI78",
    "@Grimkujow", "@FuriousJumper", "@Siphano13", "@Aypierre", "@Frigiel", "@Maghla", "@wankilfr",
    "@AntoineDaniel", "@Locklear", "@Kameto", "@AmineMaTue", "@Anyme023", "@Etoiles",
    "@Ponce", "@Byilhann", "@Kaatsup", "@Mynthos", "@AlphaCast", "@fantabobgames", "@LinksTheSun", "@MisterMV",
    "@Ultia", "@Rivenzi_", "@Hctuan", "@BagheraJonesLive", "@Ninjaxx", "@Maxildan", "@Diablox9", "@MathieuSommet",
    "@Kaydop", "@Etostark", "@Kronomuzik",
    # sport, auto, défis
    "@TiboInShape", "@jujufitcats", "@Vilebrequin", "@FlorianOnAir",
    # sciences, histoire, mystères, actu
    "@DrNozman", "@ScienceEtonnante", "@epenser", "@HugoDecrypte", "@Feldup", "@Mamytwink", "@DocSeven",
    "@Fouloscopie", "@AngleDroit",
    # cuisine
    "@ChefMichelDumas", "@FastGoodCuisine",
  ]
  watch: rss                    # le flux RSS de CHAQUE chaîne à chaque passage (gratuit, sans quota ni cookies)
  videos_per_run: 24            # vidéos récentes regardées de près par passage : les plus prometteuses (pré-score)
  resolve_per_run: 100          # chaînes dont l'identifiant YouTube est cherché par passage (une seule fois chacune)
  secondary_checks_per_run: 6   # autres chaînes d'un YouTubeur vérifiées par passage avant d'être suivies
  discover_per_run: 3           # streamers FR vus en live sur Twitch dont on cherche la chaîne YouTube, par passage
  channels_per_run: 12          # mode « rotation » seulement : à tour de rôle
  related_channels: true        # + les autres chaînes de chaque YouTubeur (« Squeezie Gaming », « Djilsi Gaming »…)
  tabs: [videos]
  videos_per_channel: 2
  max_age_days: 14              # vidéos des deux dernières semaines
  min_views: 10000              # les chaînes secondaires (replays…) font moins de vues
  segments_per_video: 2
  captions_per_run: 6           # vidéos sans « plus revus » ni minutage en commentaire dont Claude lit les sous-titres
                                #   pour y trouver les passages (une requête Claude chacune)

shorts:
  per_source: {twitch: 2, youtube: 1}  # à chaque passage (toutes les 2 h) : jusqu'à deux shorts Twitch et un YouTube
  per_run: 1                    # sans per_source : shorts publiés à chaque passage, toutes sources confondues
  candidates_factor: 3          # avec Claude : 3 candidats examinés par série et par short voulu
  review_rounds: 2              # 2 séries au plus par source et par passage : le passage suivant (2 h après) prend la suite
  long_per_day: 2               # TikTok ne rémunère que les vidéos de plus d'une minute : les 2 premiers shorts du jour qui s'y prêtent
  long_min: 61                  #   sortent dans leur version longue (61 à 90 s, coupée par Claude)
  long_max: 90
  min_score: 60                 # note de Claude sur 100 : en dessous, le clip n'est pas publié
  guarantee: {twitch: 45, youtube: 45}  # sous 60, le mieux noté part quand même s'il a au moins 45, signalé comme tel :
                                # un short de chaque source à chaque passage (« envoie de tout », 06/11)
  context_before: 30            # secondes du replay (VOD) ajoutées avant chaque clip Twitch : la mise en place (0 = clip seul)
  context_after: 15             # et après : la fin de la réaction (assez pour une version longue). Claude coupe ensuite ce qui ne sert pas
  max_per_streamer_per_day: 2
  min_duration: 8
  max_duration: 90
  layout: blur                  # blur (image entière sur fond flouté, choisi le 29/10) | auto | split (facecam en haut) | crop (plein cadre)
  captions: true                # sous-titres animés mot à mot (Whisper)
  hook: true                    # accroche incrustée en haut de la vidéo
  hook_seconds: 3
  highlight_color: "#FFE600"    # couleur du mot prononcé
  credit: true                  # « twitch.tv/<streamer> » incrusté sur la vidéo
  whisper_model: small          # tiny | base | small | medium | large-v3-turbo (plus précis, plus lent)
  max_fps: 60

compilation:
  clips: 40                     # au plus 40 clips dans le compte à rebours
  min_clips: 5
  window_days: 4                # deux best-of par semaine (mercredi, dimanche) : 4 jours chacun, sans clip repris
  target_minutes: 15            # Claude retient des clips jusqu'à ce que le best-of dure 15 min…
  max_minutes: 20               # … et jamais plus de 20
  intro: true

ai:
  enabled: auto                 # auto = Claude si ANTHROPIC_API_KEY est défini
  model: claude-opus-5-5
  effort: medium
  review_frames: true           # montre 4 images de chaque extrait à Claude (en plus de la transcription)

publish:
  youtube:
    enabled: auto               # auto = si les secrets YOUTUBE_* sont présents
    privacy: public             # public | unlisted | private
    category_id: "20"           # 20 Jeux vidéo, 24 Divertissement, 23 Humour
    shorts: true
    compilations: true
    notify_subscribers: true
    youtube_sources: false      # les extraits de vidéos YouTube ne sont pas republiés sur YouTube (Content ID)
  tiktok:
    enabled: auto
    mode: inbox                 # inbox = brouillon dans votre appli TikTok (1 tap pour publier) ; direct = publication directe (app auditée)
    privacy: PUBLIC_TO_EVERYONE
  telegram:
    enabled: auto               # chaque vidéo arrive sur votre téléphone avec le texte à coller

# Chaînes qui ont demandé à ne pas être clippées : jamais téléchargées.
blocklist: []

