# Configuration du clipper. Toutes les clés sont facultatives (valeurs par défaut dans clipper/config.py).
# Une clé inconnue ou une valeur invalide arrête le programme avec un message clair.

channel:
  # YouTube : https://www.youtube.com/channel/UC7iURKSML3pyYVII8bbcRUw · TikTok : https://www.tiktok.com/@tesmeilleursclips
  name: "Tes Meilleurs Clips"   # nom de la chaîne (Claude s'en sert pour les textes du best-of)
  language: fr                  # langue des sous-titres et des métadonnées
  hashtags: [clip, twitchfr, drole]

