  # Avec les clés API Twitch, tout Twitch FR en plus de la liste :
  discover_live: true
  discover_language: fr
  discover_limit: 100           # les 100 plus gros lives FR du moment
  remember_live: 150            # + jusqu'à 150 chaînes FR vues ces 14 derniers jours (même hors ligne)
  discover_categories: 20       # + les clips FR les plus vus de la semaine dans les 20 catégories les plus regardées
  clips_per_streamer: 20
  window_hours: 168             # ancienneté maximale d'un clip pour un short (7 jours : les plus vus d'abord)
  min_views: 150               # Claude écarte ensuite les clips sans intérêt
  # Clips jamais téléchargés si leur titre contient un de ces mots (watch parties, pubs : Claude les refuse toujours).
  skip_title_words: [worlds, watch party, watchparty, co-stream, costream, publicité, sponsorisé, partenariat]

youtube:
  # Moments « les plus revus » des vidéos récentes des YouTubeurs FR (testé depuis GitHub le 29/10 : pas bloqué).
  # Ces extraits ne sont pas republiés sur YouTube (Content ID) : publish.youtube.youtube_sources.
  enabled: true
  # YouTubeurs FR de tous les domaines. Une chaîne introuvable est signalée dans le journal du passage.
  channels: [
    # humour, divertissement, vlogs
    "@Squeezie", "@Amixem", "@Inoxtag", "@Michou", "@mcflyetcarlito", "@cyprien", "@NormanFaitDesVideos",
    "@MisterV", "@Joyca", "@SebLaFrite", "@Lebouseuh", "@Natoo", "@LeRireJaune", "@HugoToutSeul",
    "@PierreCroce", "@LeGrandJD", "@Valouzz", "@goldenmoustache", "@StudioBagel", "@Ludovik", "@AndyRaconte",
    "@LenaSituations", "@EnjoyPhoenix", "@LeaElui", "@PoissonFecond", "@Djilsi", "@MaximeBiaggi", "@JhonRachid",
    # jeux vidéo et streamers
    "@JoueurDuGrenier", "@Gotaga", "@Mastu", "@Domingo", "@ZeratoR", "@Sardoche", "@Doigby", "@TheKAIRI78",
    "@Grimkujow", "@FuriousJumper", "@Siphano", "@Aypierre", "@Frigiel", "@Maghla", "@WankilStudio",
    "@AntoineDaniel", "@Locklear", "@Kameto", "@AmineMaTue", "@Anyme023", "@Terracid", "@Laink", "@Etoiles",
    "@Ponce", "@Byilhann", "@Kaatsup", "@Mynthos", "@AlphaCast",
    # sport, auto, défis
    "@TiboInShape", "@jujufitcats", "@Vilebrequin", "@FlorianOnAir",
    # sciences, histoire, mystères, actu
    "@DrNozman", "@ScienceEtonnante", "@epenser", "@HugoDecrypte", "@Feldup", "@Mamytwink",
    # cuisine
    "@ChefMichelDumas", "@FastGoodCuisine",
  ]
  channels_per_run: 8           # à tour de rôle
  related_channels: true        # + les autres chaînes de chaque YouTubeur (« Squeezie Gaming », « Djilsi Gaming »…)
  tabs: [videos]
  videos_per_channel: 2
  max_age_days: 7
  min_views: 50000
  segments_per_video: 2

shorts:
  per_run: 1                    # shorts publiés à chaque passage (5 passages par jour dans le workflow)
  candidates_factor: 3          # avec Claude : 3 candidats examinés par série (jusqu'à 3 séries par passage)
  min_score: 60                 # note de Claude sur 100 : en dessous, le clip n'est pas publié
  context_before: 20            # secondes du replay (VOD) ajoutées avant chaque clip Twitch : la mise en place (0 = clip seul)
  context_after: 8              # et après : la fin de la réaction. Claude coupe ensuite ce qui ne sert pas
  max_per_streamer_per_day: 2
  min_duration: 8
  max_duration: 90
  layout: blur                  # blur (image entière sur fond flouté, choisi le 29/10) | auto | split (facecam en haut) | crop (plein cadre)
  captions: true                # sous-titres animés mot à mot (Whisper)
  hook: true                    # accroche incrustée en haut de la vidéo
  hook_seconds: 3
  highlight_color: "#FFE600"    # couleur du mot prononcé
  credit: true                  # « twitch.tv/<streamer> » incrusté sur la vidéo
  whisper_model: small          # tiny | base | small | medium | large-v3-turbo (plus précis, plus lent)
  max_fps: 60

compilation:
  clips: 12                     # « TOP 12 » de la semaine
  min_clips: 5
  window_days: 7
  max_minutes: 15
  intro: true

ai:
  enabled: auto                 # auto = Claude si ANTHROPIC_API_KEY est défini
  model: claude-opus-5-5
  effort: medium
  review_frames: true           # montre 4 images de chaque extrait à Claude (en plus de la transcription)

publish:
  youtube:
    enabled: auto               # auto = si les secrets YOUTUBE_* sont présents
    privacy: public             # public | unlisted | private
    category_id: "20"           # 20 Jeux vidéo, 24 Divertissement, 23 Humour
    shorts: true
    compilations: true
    notify_subscribers: true
    youtube_sources: false      # les extraits de vidéos YouTube ne sont pas republiés sur YouTube (Content ID)
  tiktok:
    enabled: auto
    mode: inbox                 # inbox = brouillon dans votre appli TikTok (1 tap pour publier) ; direct = publication directe (app auditée)
    privacy: PUBLIC_TO_EVERYONE
  telegram:
    enabled: auto               # chaque vidéo arrive sur votre téléphone avec le texte à coller

# Chaînes qui ont demandé à ne pas être clippées : jamais téléchargées.
blocklist: []

