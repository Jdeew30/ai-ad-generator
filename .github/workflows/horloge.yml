name: Horloge du robot

# Arrêtée le 8/11 avec le robot, à la demande du propriétaire : plus de planning, seulement le lancement à la main.
# Elle lançait un passage de clipper.yml s'il n'y en avait pas eu depuis 170 min.
on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: horloge
  cancel-in-progress: false

jobs:
  lancer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lancer un passage s'il n'y en a pas eu depuis 170 min
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }} # planifié : la branche par défaut
        run: |
          last=$(gh run list --workflow clipper.yml --limit 1 --json createdAt,status --jq '.[0] // empty | "\(.createdAt) \(.status)"')
          created=${last%% *}
          status=${last##* }
          echo "Dernier passage de clipper.yml : ${last:-aucun}"
          if [ -n "$last" ] && [ "$status" != "completed" ]; then
            echo "Un passage est en cours : rien à lancer."
            exit 0
          fi
          if [ -n "$created" ] && [ $(( $(date -u +%s) - $(date -u -d "$created" +%s) )) -lt 10200 ]; then
            echo "Un passage a commencé il y a moins de 170 min : rien à lancer."
            exit 0
          fi
          gh workflow run clipper.yml --ref "$BRANCH" -f mode=shorts
          echo "Passage lancé."
