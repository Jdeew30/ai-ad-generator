name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adstudio
          POSTGRES_PASSWORD: adstudio_dev
          POSTGRES_DB: adstudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://adstudio:adstudio_dev@localhost:5432/adstudio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://adstudio:adstudio_dev@localhost:5432/adstudio_test
          BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
