name: Clipper CI

# Une branche de travail est testée par sa pull request, la branche principale à chaque fusion (avec l'essai à blanc) ;
# un nouvel envoi annule le test encore en cours du précédent : moins de minutes GitHub Actions comptées.
on:
  push:
    branches: [claude/modest-ptolemy-67bgwo]
    paths: ["clipper/**", ".github/workflows/clipper*.yml"]
  pull_request:
    paths: ["clipper/**", ".github/workflows/clipper*.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clipper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clipper/requirements*.txt
      - name: Installer ffmpeg
        # Même installation bornée que le passage (clipper.yml) : un miroir Ubuntu peut bloquer apt sans rien afficher.
        timeout-minutes: 15
        run: |
          opts=(-qq -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          for attempt in 1 2 3; do
            if timeout -k 10 120 sudo apt-get update "${opts[@]}" &&
               timeout -k 10 240 sudo apt-get install -y "${opts[@]}" ffmpeg; then
              exit 0
            fi
            echo "::warning::Installation de ffmpeg bloquée ou en échec (essai $attempt sur 3)"
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Vrai Twitch, sans aucun identifiant et sans rien publier : prouve que la découverte, le
  # téléchargement, la transcription et le montage fonctionnent aujourd'hui. Le short monté est
  # disponible en artefact du workflow.
  smoke:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: clipper
    env:
      CLIPPER_OUTPUT_DIR: ${{ github.workspace }}/smoke-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clipper/requirements*.txt
      - name: Installer ffmpeg
        # Même installation bornée que le passage (clipper.yml) : un miroir Ubuntu peut bloquer apt sans rien afficher.
        timeout-minutes: 15
        run: |
          opts=(-qq -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          for attempt in 1 2 3; do
            if timeout -k 10 120 sudo apt-get update "${opts[@]}" &&
               timeout -k 10 240 sudo apt-get install -y "${opts[@]}" ffmpeg; then
              exit 0
            fi
            echo "::warning::Installation de ffmpeg bloquée ou en échec (essai $attempt sur 3)"
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1
      - run: pip install -r requirements.txt
      - name: Modèle Whisper en cache
        uses: actions/cache@v4
        with:
          path: clipper/data/models
          key: whisper-${{ hashFiles('clipper/config.yaml') }}
          restore-keys: whisper-
      - name: Essai à blanc sur les clips Twitch du moment
        run: python -m clipper run --dry-run --count 1 --no-queue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipper-smoke-${{ github.run_id }}
          path: smoke-output/
          retention-days: 1 # GitHub gratuit : 500 Mo d'artefacts en tout
          if-no-files-found: ignore
