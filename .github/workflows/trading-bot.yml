name: Trading bot

on:
  push:
    paths: ["trading-bot/**", ".github/workflows/trading-bot.yml"]
  pull_request:
    paths: ["trading-bot/**", ".github/workflows/trading-bot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-bot
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m tradebot backtest --source synthetic --config absent.toml
