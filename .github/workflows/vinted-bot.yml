name: Vinted bot

on:
  push:
    paths: ["vinted-bot/**", ".github/workflows/vinted-bot.yml"]
  pull_request:
    paths: ["vinted-bot/**", ".github/workflows/vinted-bot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vinted-bot
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m vintedbot test-notify --config config.example.toml --env absent.env
