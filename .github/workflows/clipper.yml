name: Clipper

# Robot de la chaîne : toutes les 2 heures, les moments qui partent en ce moment (Twitch et YouTube), + un best-of
# le mercredi et le dimanche. Les horaires sont en UTC (Paris = UTC+1 l'hiver, UTC+2 l'été) ; GitHub lance souvent
# les passages planifiés avec du retard. Les workflows planifiés ne tournent que depuis la branche par défaut.
on:
  schedule:
    # Heures en liste, la forme des exemples de GitHub (« 30 5,17 * * * ») : écrites « 8-22/2 » (plage avec pas), elles
    # n'ont jamais été lancées le 6/11, alors que les heures fixes d'avant l'étaient (avec environ 1 h de retard).
    - cron: "37 8,10,12,14,16,18,20,22 * * *" # toutes les 2 h, de ~9h37 à ~23h37 à Paris (hiver)
    # Secours, 30 min après : GitHub ne garantit pas ses passages planifiés et en saute parfois.
    # Celui-ci ne fait rien si un passage a commencé il y a moins d'une heure (--skip-if-ran-within).
    - cron: "7 9,11,13,15,17,19,21,23 * * *"
    - cron: "41 7 * * 3" # mercredi ~8h41 : best-of du début de semaine
    - cron: "41 7 * * 0" # dimanche ~8h41 : best-of de la fin de semaine
  workflow_dispatch:
    inputs:
      mode:
        description: "shorts = clips du moment, compilation = best-of, url = monter une URL précise, clips = autres clips d'un même moment, check = vérifier les branchements"
        type: choice
        options: [shorts, compilation, url, clips, check]
        default: shorts
      url:
        description: "Mode url : clip Twitch, VOD, vidéo YouTube… ou plusieurs clips d'un même moment séparés par des espaces (recollés). Mode clips : le lien du clip Twitch"
        required: false
      start:
        description: "Mode url : début (ex. 1:23)"
        required: false
      end:
        description: "Mode url : fin (ex. 2:05)"
        required: false
      find:
        description: "Mode url : une phrase dite dans la vidéo, pour en couper le passage (début et fin = où la chercher, vides = toute la vidéo)"
        required: false
      focus:
        description: "Mode shorts : seulement ces chaînes ou vidéos (ex. gotaga, aminematue, @Gotaga, lien YouTube). Mode clips : une autre chaîne, pour sa POV du même moment"
        required: false
      count:
        description: "Mode shorts : nombre de shorts (vide = 1)"
        required: false
      force:
        description: "Mode shorts : si aucun clip n'atteint la note minimale, envoyer quand même le mieux noté par Claude"
        type: boolean
        default: false
      dry_run:
        description: "Essai à blanc : monter sans publier"
        type: boolean
        default: false

permissions:
  contents: write # pousse l'état (clips déjà publiés) sur la branche clipper-state
  actions: write # supprime les vidéos des anciens passages (GitHub gratuit : 500 Mo pour les artefacts)

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    # Le best-of (environ 15 min de vidéo, des dizaines de clips examinés) demande bien plus de temps qu'un passage.
    timeout-minutes: ${{ (github.event.schedule == '41 7 * * 0' || github.event.schedule == '41 7 * * 3' || inputs.mode == 'compilation') && 150 || 75 }}
    defaults:
      run:
        working-directory: clipper
    env:
      CLIPPER_STATE_PATH: ${{ github.workspace }}/.clipper-state/state.json
      CLIPPER_OUTPUT_DIR: ${{ github.workspace }}/clipper-output
      MODE: ${{ github.event_name == 'schedule' && ((github.event.schedule == '41 7 * * 0' || github.event.schedule == '41 7 * * 3') && 'compilation' || 'shorts') || inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Charger l'état (branche clipper-state)
        working-directory: ${{ github.workspace }}
        run: |
          if git ls-remote --exit-code --heads origin clipper-state > /dev/null 2>&1; then
            git fetch --depth=1 origin clipper-state
            git worktree add --detach .clipper-state FETCH_HEAD
          else
            git worktree add --orphan -b clipper-state .clipper-state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clipper/requirements.txt

      - name: Installer ffmpeg
        # Un miroir Ubuntu peut bloquer apt (12 min au passage d'essai n° 108, d'habitude 20 s) : essais bornés, puis
        # l'archive officielle d'Ubuntu (voir le script).
        timeout-minutes: 15
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-ffmpeg.sh"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Modèle Whisper en cache
        uses: actions/cache@v4
        with:
          path: clipper/data/models
          key: whisper-${{ hashFiles('clipper/config.yaml') }}
          restore-keys: whisper-

      - name: Lancer le clipper
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_URL: ${{ secrets.TELEGRAM_API_URL }}  # facultatif : serveur Bot API local (vidéos jusqu'à 2 Go)
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          URL: ${{ inputs.url }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          FIND: ${{ inputs.find }}
          FOCUS: ${{ inputs.focus }}
          COUNT: ${{ inputs.count }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          # Passage planifié : rien à faire si un autre a déjà fait ce créneau (secours, ou retard de GitHub).
          SLOT: ${{ github.event_name == 'schedule' && '60' || '' }}
        run: |
          case "$MODE" in
            compilation) python -m clipper compile $DRY_RUN ;;
            check) python -m clipper check ;;
            clips)
              if [ -z "$URL" ]; then echo "::error::Le mode clips demande le lien d'un clip Twitch"; exit 1; fi
              python -m clipper clips "$URL" ${FOCUS:+--channel "$FOCUS"} ;;
            url)
              if [ -z "$URL" ]; then echo "::error::Le mode url demande une URL"; exit 1; fi
              python -m clipper run $DRY_RUN --url "$URL" ${START:+--start "$START"} ${END:+--end "$END"} ${FIND:+--find "$FIND"} ;;
            *) python -m clipper run $DRY_RUN $FORCE ${FOCUS:+--focus "$FOCUS"} ${COUNT:+--count "$COUNT"} \
                 ${SLOT:+--skip-if-ran-within "$SLOT"} ;;
          esac

      # Le 04/11, GitHub a répondu « Internal Server Error » à l'envoi de l'état deux passages de suite : l'état
      # était perdu (clips envoyés oubliés, donc renvoyables) et le lien du best-of n'était pas parti. L'envoi est
      # retenté ; s'il échoue quand même, l'état est joint au passage (artefact) pour être remis à la main.
      - name: Sauvegarder l'état
        id: save
        if: always()
        working-directory: ${{ github.workspace }}/.clipper-state
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="clipper-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "clipper: état du $(date -u '+%F %H:%M') UTC"
          for wait in 15 45 90 0; do
            if git push -q origin HEAD:clipper-state; then exit 0; fi
            if [ "$wait" = 0 ]; then break; fi
            echo "Envoi de l'état refusé par GitHub, nouvel essai dans $wait s…"
            sleep "$wait"
          done
          echo "::error::État non sauvegardé (GitHub refuse l'envoi) : il est joint à ce passage (etat-non-sauvegarde)."
          exit 1

      - name: État non sauvegardé (à remettre sur la branche clipper-state)
        if: failure() && steps.save.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: etat-non-sauvegarde-${{ github.run_id }}
          path: |
            .clipper-state/*.json
            .clipper-state/*.md
          retention-days: 7
          include-hidden-files: true  # .clipper-state est un dossier caché

      # GitHub gratuit garde 500 Mo d'artefacts, et bloque les dépôts au-delà. Les shorts sont déjà sur
      # Telegram : leurs copies ne restent qu'un jour. Le best-of va dans une release (étape suivante).
      - name: Faire de la place (vidéos des anciens passages)
        if: always()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export CUTOFF="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" |
            jq '.artifacts[] | select((.expired | not) and (.name | test("compilation") | not) and .created_at < $ENV.CUTOFF) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent && echo "supprimé : artefact $id"
          done

      # Le best-of pèse des centaines de Mo : trop pour Telegram (50 Mo) comme pour les artefacts (500 Mo en
      # tout). Il part en MP4 dans une release du dépôt, avec sa description (chapitres, crédits), et son lien
      # arrive sur Telegram. Les 4 derniers best-of sont gardés.
      - name: Best-of à télécharger (release)
        id: release
        if: ${{ !cancelled() && env.MODE == 'compilation' && !inputs.dry_run }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          video=$(ls clipper-output/*_compilation.mp4 2>/dev/null | head -n 1)
          if [ -z "$video" ]; then echo "Pas de best-of à ce passage."; exit 0; fi
          tag="best-of-$(date -u +%F)-$GITHUB_RUN_ID"
          files=("$video")
          if [ -f "${video%.mp4}.jpg" ]; then files+=("${video%.mp4}.jpg"); fi
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "Best-of du $(date -u +%d/%m/%Y)" --notes-file "${video%.mp4}.txt"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$video")"
          text="⬇️ Best-of à télécharger (MP4) : $url

          Si GitHub répond « 404 » (dépôt privé), ouvre le lien dans ton navigateur connecté à ton compte GitHub. Tous les best-of : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS --fail -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text" --data "disable_web_page_preview=true"
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            grep '^best-of-' | tail -n +5 | while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes && echo "supprimé : $old"
            done

      - name: Vidéos montées (à télécharger pour publier à la main si besoin)
        if: always() && (env.MODE != 'compilation' || steps.release.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: clipper-${{ env.MODE }}-${{ github.run_id }}
          path: clipper-output/
          retention-days: ${{ env.MODE == 'compilation' && 7 || 1 }}
          if-no-files-found: ignore
